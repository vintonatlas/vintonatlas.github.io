:root {

}
@media (prefers-color-scheme: dark) {

    --paper: #1D1816; --sheet: #27211E; --ink: #F2EAE0; --muted: #BCAEA2;

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--serif); font-size: 1.0625rem; line-height: 1.5;
  padding: 2rem max(16px, env(safe-area-inset-right, 0px)) 3rem max(16px, env(safe-area-inset-left, 0px));
}
.page { max-width: 46rem; margin: 0 auto; }
.kicker { font-family: var(--sans); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--claret); margin: 0 0 .35rem; font-weight: 600; }
h1 { font-weight: 600; font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.1; color: var(--claret); margin: 0 0 .6rem; letter-spacing: -.005em; text-wrap: balance; }
.intro { margin: 0 0 1.5rem; color: var(--ink); max-width: 36em; }
.search { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: .75rem 0 .6rem; border-bottom: 1px solid var(--line); }
.search label { display: block; font-family: var(--sans); font-size: .85rem; color: var(--muted); margin-bottom: .3rem; }
.search input {
  width: 100%; font: 400 1.0625rem/1.3 var(--sans); color: var(--ink);
  background: var(--sheet); border: 1px solid var(--line); border-radius: 8px;
  padding: .7rem .85rem; outline: none; -webkit-appearance: none; appearance: none;
}
.search input:focus { border-color: var(--claret); box-shadow: 0 0 0 3px color-mix(in srgb, var(--claret) 18%, transparent); }
.count { font-family: var(--sans); font-size: .875rem; color: var(--muted); margin: .45rem 0 0; font-variant-numeric: tabular-nums; }
h2 { font-weight: 600; font-size: 1.45rem; color: var(--claret); margin: 2rem 0 .1rem; padding-bottom: .25rem; border-bottom: 1px solid var(--claret); }
h3 { font-family: var(--sans); font-weight: 600; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 1.1rem 0 .15rem; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: 1fr auto; column-gap: 1rem; align-items: baseline; padding: .5rem 0; border-bottom: 1px solid var(--line); }
.name { font-weight: 600; }
.meta { grid-column: 1; font-family: var(--sans); font-size: .9rem; color: var(--muted); line-height: 1.35; }
.meta .style { color: var(--ink); }
.pg { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-family: var(--sans); font-size: .875rem; font-weight: 600; color: var(--claret); white-space: nowrap; font-variant-numeric: tabular-nums; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.empty { font-family: var(--sans); color: var(--muted); padding: 2rem 0; }
footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); font-family: var(--sans); font-size: .85rem; color: var(--muted); text-align: center; }
@media (min-width: 720px) {
  body { padding-top: 3.5rem; }
  li { grid-template-columns: minmax(0, 15rem) 1fr auto; }
  .meta { grid-column: 2; }
  .pg { grid-column: 3; grid-row: 1; }
}

const TOTAL = 312;
const ALIAS = { "United States": "usa us america american", "England": "uk united kingdom britain british english" };
const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()

// highlight: map folded positions back onto the original string, char by char
function hi(text, terms) {
  if (!terms.length) return esc(text);
  const f = [], idx = [];

    const c = fold(text[i]) || (text[i] === " " ? " " : "");

  const fs = f.join(""), on = new Array(text.length).fill(false);

  for (let i = 0; i < text.length; i++) {
